[package]
name = "wangan-io"
description = "The JVS I/O board the Maximum Tune 5-6RR games talk to under Wine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wangan-io"
path = "src/main.rs"

[dependencies]
wangan-jvs = { path = "../wangan-jvs" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
