[package]
name = "wangan-core"
description = "The Wangan Midnight launcher's logic: games, editions, runtime folders, settings and launch plans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wangan-jvs = { path = "../wangan-jvs" }
sha1 = "0.10"
zip = { version = "9.7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rea-launcher = { workspace = true, features = ["linkfarm"] }

[dev-dependencies]
tempfile = "3"
