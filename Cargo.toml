[workspace]
members = ["crates/wangan-jvs", "crates/wangan-io"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/akitaonrails/rea-teknoparrot-wangan-series"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
