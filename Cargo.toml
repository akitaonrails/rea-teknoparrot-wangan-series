[workspace]
members = ["crates/wangan-jvs", "crates/wangan-io", "crates/wangan-core", "crates/wangan-launcher"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/akitaonrails/rea-teknoparrot-wangan-series"

[workspace.dependencies]
# The shared launcher SDK, pinned to a release tag (rea-launcher-sdk docs/playbooks/sdk-change.md).
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }
rea-launcher-native = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0", default-features = false, features = ["child", "sdl"] }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

# Temporary: the SDK's hub branch, until v0.10.0 is tagged (the lead swaps
# this for the tag).
[patch."https://github.com/akitaonrails/rea-launcher-sdk"]
rea-launcher = { path = "/mnt/data/Projects/rea-launcher-sdk-hub/crates/rea-launcher" }
rea-launcher-native = { path = "/mnt/data/Projects/rea-launcher-sdk-hub/crates/rea-launcher-native" }
rea-launcher-ui = { path = "/mnt/data/Projects/rea-launcher-sdk-hub/crates/rea-launcher-ui" }
