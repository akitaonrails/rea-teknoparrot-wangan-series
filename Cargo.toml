[workspace]
members = ["crates/wangan-jvs", "crates/wangan-io", "crates/wangan-core", "crates/wangan-launcher"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/akitaonrails/rea-teknoparrot-wangan-series"

[workspace.dependencies]
# The shared launcher SDK, pinned to a release tag (rea-launcher-sdk docs/playbooks/sdk-change.md).
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.10.0" }
rea-launcher-native = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.10.0", default-features = false, features = ["child", "sdl"] }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.10.0" }
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.10.0" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
