name: CI

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Shell scripts
        run: for f in scripts/*.sh; do sh -n "$f"; done

  # The Windows code (runtime junctions, the direct game session, the
  # leftover-process sweep) is linted for its target and its tests run
  # under Wine, headless (rea-launcher-sdk STANDARDS: Windows code is run,
  # not only linted).
  windows:
    # ubuntu-24.04: 26.04's wine package keeps wineserver off PATH
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 lld wine wine64 wine32:i386 curl
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: Windows target links with lld
        run: sh sdk/packaging/check-lld.sh x86_64-pc-windows-gnu
      - name: Clippy (x86_64-pc-windows-gnu)
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      - name: SDL2 (pinned MinGW package)
        run: scripts/build-launcher.sh sdl2
      - name: Tests under Wine
        run: |
          sdl="$PWD/dist/sdl2/$(sed -n 's/^dir=//p' packaging/sdl2.pin)"
          export PATH="$PATH:/usr/lib/wine"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -L $sdl/lib"
          export WINEPATH="Z:$(printf '%s' "$PWD/dist/sdl2" | tr / '\\')"
          sdk/scripts/wine-test --target x86_64-pc-windows-gnu --locked --workspace
