name: build

# Checks every push (the SDK's launcher-ci: fmt, tests, clippy, deny, the
# family rules; the Windows-target tests under Wine), and builds the full
# packages for Linux and Windows from pinned sources and pinned downloads
# (packaging/components.pins, packaging/sources.sh) on pushes to the release
# branch, on tags and on a manual run. A tag vX.Y.Z (matching the workspace
# version) publishes them with the source archive, once the checks and the
# Wine tests passed (the SDK's launcher-release: SHA256SUMS, provenance,
# the tag's CHANGELOG section as notes).
on:
  push:
    branches: [main, release]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.12.4
    with:
      concurrency-key: linux
      rust-target: ""
      apt-packages: libsdl2-dev
      shell-syntax: scripts/*.sh sdk/packaging/*.sh
      shell-tests: ""
      imports-check: false

  # The Windows code (the direct game session, the runtime junctions) is
  # linted for its target and its tests run under Wine, headless
  # (STANDARDS: Windows code is run, not only linted), with the pinned SDL2
  # MinGW package linked in. The Wine the Linux package ships (11.21):
  # Ubuntu's Wine 9 does not follow directory junctions.
  windows-tests:
    # ubuntu-24.04: 26.04's wine package keeps wineserver off PATH
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 lld wine wine64 wine32:i386 curl
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: Windows target links with lld
        run: sh sdk/packaging/check-lld.sh x86_64-pc-windows-gnu
      - name: SDL2 (pinned MinGW package)
        run: |
          scripts/build-launcher.sh sdl2
          echo "SDL2_LIB=$(ls -d "$PWD"/dist/sdl2/SDL2-*/x86_64-w64-mingw32)/lib" >> "$GITHUB_ENV"
      - name: Clippy (x86_64-pc-windows-gnu)
        run: |
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -L $SDL2_LIB"
          cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      - name: Wine 11.21 (pinned)
        run: |
          . sdk/packaging/pins.sh
          PIN_FILE=packaging/components.pins
          mkdir -p "$RUNNER_TEMP/wine"
          tar -xJf "$(pin_fetch wine "$RUNNER_TEMP/dl")" -C "$RUNNER_TEMP/wine" --strip-components=1
          echo "$RUNNER_TEMP/wine/bin" >> "$GITHUB_PATH"
      - name: Tests under Wine
        run: |
          wine --version
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -L $SDL2_LIB"
          export WINEPATH="Z:$(printf '%s' "$PWD/dist/sdl2" | tr / '\\')"
          sdk/scripts/wine-test --target x86_64-pc-windows-gnu --locked --workspace

  # OpenParrot64.dll + OpenParrotLoader64.exe with MSVC, as upstream's
  # appveyor.yml builds them (the repository's premake5 alpha14 writes
  # VS2017 projects; msbuild builds them Release x64 with the runner's
  # VS2022 toolset, v143): teknogods
  # OpenParrot (MT5-6R) and valkyrieasyraf OpenParrot_WMMT (6RR), each
  # with our patches.
  openparrot:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Sources at the pinned commits, with our patches
        shell: bash
        run: scripts/fetch-sources.sh "$RUNNER_TEMP/src" openparrot openparrot-wmmt
      - name: The fixes are in the sources being built
        shell: bash
        run: |
          s="$RUNNER_TEMP/src"
          git -C "$s/openparrot" diff --stat
          git -C "$s/openparrot-wmmt" diff --stat
          grep -n "fwrite(carData, 1, 0xE0, carSave)" "$s/openparrot/OpenParrot/src/Functions/Games/ES3X/WMMT6_LEG.cpp"
          grep -n -i "fcontext" "$s/openparrot/OpenParrot/src/Functions/Games/ES3X/WMMT6_LEG.cpp" | head -5
          grep -n "mForceFeedback\|mIcCardVender" "$s/openparrot-wmmt/OpenParrot/src/Functions/Games/ES3X/WMMT6RR.cpp" | head -5
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        shell: cmd
        run: |
          for %%d in (openparrot openparrot-wmmt) do (
            pushd "%RUNNER_TEMP%\src\%%d" || exit /b 1
            premake5.exe vs2017 || exit /b 1
            msbuild OpenParrot.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /t:OpenParrot;OpenParrotLoader || exit /b 1
            popd
          )
      - name: Collect
        shell: bash
        run: |
          set -eu
          for d in upstream:openparrot wmmt:openparrot-wmmt; do
            mkdir -p "dist/openparrot/${d%%:*}"
            b="$RUNNER_TEMP/src/${d#*:}/build/bin/release"
            cp "$b/OpenParrot64.dll" "$b/OpenParrotLoader64.exe" "dist/openparrot/${d%%:*}/"
          done
          (cd dist/openparrot && sha256sum */*)
      - uses: actions/upload-artifact@v4
        with:
          name: openparrot-build
          path: dist/openparrot/
          if-no-files-found: error

  # The Windows launcher and the I/O board: MinGW-w64 + LLD on Arch, like
  # the local `gaming` distrobox.
  windows-programs:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed git mingw-w64-gcc lld rustup curl
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup default stable && rustup target add x86_64-pc-windows-gnu
      - name: Build
        run: scripts/build-launcher.sh windows
      - name: Imports are complete (LLD)
        run: sh sdk/packaging/check-imports.sh target/x86_64-pc-windows-gnu/release/wangan-launcher.exe target/x86_64-pc-windows-gnu/release/wangan-io.exe
      - name: Collect
        run: |
          mkdir -p dist/windows
          cp target/x86_64-pc-windows-gnu/release/wangan-launcher.exe target/x86_64-pc-windows-gnu/release/wangan-io.exe dist/windows/
          cp dist/sdl2/SDL2.dll dist/windows/
          cp dist/sdl2/SDL2-*/LICENSE.txt dist/windows/SDL2-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-programs
          path: dist/windows/
          if-no-files-found: error

  # The Linux launcher, WanganArcadeLoader (i686) and FFmpeg 4 for the
  # bundled Wine, on Debian bookworm (glibc 2.36) so they run on older
  # distributions too.
  linux-programs:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 90
    steps:
      - name: System packages
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib \
            cmake pkg-config ca-certificates git curl xz-utils patch \
            libsdl2-dev libsdl2-dev:i386 libdbus-1-dev:i386 libdecor-0-dev:i386 \
            libxrandr-dev:i386 libxinerama-dev:i386 libxcursor-dev:i386 libxi-dev:i386 \
            libgl-dev:i386 libglib2.0-dev:i386 libibus-1.0-dev:i386 libdrm-dev:i386
      - uses: actions/checkout@v5
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Launcher
        run: |
          # libSDL2 ships in lib/ beside the program, found through its RUNPATH
          RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN/lib' cargo build --release --locked -p wangan-launcher
          mkdir -p dist/linux/lib
          cp target/release/wangan-launcher dist/linux/
          cp -L "$(ldconfig -p | awk '$1 == "libSDL2-2.0.so.0" && /x86-64/ { print $NF; exit }')" dist/linux/lib/
          cp /usr/share/doc/libsdl2-2.0-0/copyright dist/linux/SDL2-copyright.txt
          readelf -d dist/linux/wangan-launcher | grep -E "RUNPATH|NEEDED"
      - name: WanganArcadeLoader
        run: |
          rustup target add i686-unknown-linux-gnu
          scripts/fetch-sources.sh "$RUNNER_TEMP/src" wal
          scripts/build-wal.sh "$RUNNER_TEMP/src/wal" "$RUNNER_TEMP/wal"
          cp "$RUNNER_TEMP/wal/libwal_3dxp.so" dist/linux/
          objdump -T dist/linux/libwal_3dxp.so | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1
      - name: FFmpeg 4 for Wine's movie demuxer
        run: |
          scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          mkdir -p dist/linux/ffmpeg
          cp -r "$RUNNER_TEMP/ffmpeg/lib" "$RUNNER_TEMP/ffmpeg/CONFIGURE.txt" "$RUNNER_TEMP/ffmpeg/COPYING.LGPLv2.1" dist/linux/ffmpeg/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-programs
          path: dist/linux/
          if-no-files-found: error

  packages:
    needs: [openparrot, windows-programs, linux-programs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip xz-utils p7zip-full
      - uses: actions/download-artifact@v4
        with:
          name: openparrot-build
          path: dist/openparrot
      - uses: actions/download-artifact@v4
        with:
          name: windows-programs
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: linux-programs
          path: dist/linux
      - name: Linux package
        run: |
          chmod +x dist/linux/wangan-launcher
          scripts/package.sh linux
      - name: Windows package
        run: scripts/package.sh windows
      - name: Source archive
        run: scripts/source-archive.sh
      - name: Contents
        run: |
          cd dist/pkg
          ls -l *.tar.gz *.zip
          tar -tzf WanganLauncher-*-linux-x86_64.tar.gz | grep -v "/components/wine/" | sort
          unzip -l WanganLauncher-*-windows-x86_64.zip
          # every file is on the package's allowlist (no game file, no stray build output)
          sh ../../sdk/packaging/smoke-package.sh WanganLauncher-*-linux-x86_64/ ../../packaging/allowlist-linux.txt
          sh ../../sdk/packaging/smoke-package.sh WanganLauncher-*-windows-x86_64.zip ../../packaging/allowlist-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WanganLauncher-packages
          path: |
            dist/pkg/WanganLauncher-*-linux-x86_64.tar.gz
            dist/pkg/WanganLauncher-*-windows-x86_64.zip
            dist/pkg/WanganLauncher-*-source.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, windows-tests, packages]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.12.4
    with:
      package: wangan-launcher
      artifact-pattern: WanganLauncher-*
